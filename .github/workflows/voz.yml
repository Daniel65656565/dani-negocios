# Sube el servidor de voz a Fly.io (Miami). Corre solo cuando se aprieta "Run workflow" en GitHub > Actions,
# o cuando cambia esta rama. Las llaves viven en GitHub > Settings > Secrets and variables > Actions (las pega Daniel).
name: Servidor de voz (Fly.io)
on:
  workflow_dispatch:
  push:
    branches: [servidor-voz]
concurrency: voz
jobs:
  subir:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ vars.FLY_APP || 'voz-danipro' }}
    steps:
      - name: ¿Ya están las llaves?
        id: listo
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "Todavía no está FLY_API_TOKEN en los secrets. No se sube nada."; echo "ok=no" >> "$GITHUB_OUTPUT"; else echo "ok=si" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.listo.outputs.ok == 'si'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.listo.outputs.ok == 'si'
      - name: Crear la app si no existe
        if: steps.listo.outputs.ok == 'si'
        run: flyctl status --app "$APP" >/dev/null 2>&1 || flyctl apps create "$APP"
      - name: Poner las llaves en Fly (sin mostrarlas)
        if: steps.listo.outputs.ok == 'si'
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
          TELNYX_PUBLIC_KEY: ${{ secrets.TELNYX_PUBLIC_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          TELEFONO_SECRETO: ${{ secrets.TELEFONO_SECRETO }}
          VOZ_URL_CLAVE: ${{ secrets.VOZ_URL_CLAVE }}
        run: |
          flyctl secrets set --app "$APP" --stage \
            PROVEEDOR=telnyx PUBLIC_HOST="$APP.fly.dev" \
            CEREBRO_URL="https://dsxbxbtgtuznlxiyfobu.supabase.co/functions/v1/telefono" \
            SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzeGJ4YnRndHV6bmx4aXlmb2J1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNDkxMjMsImV4cCI6MjEwODYyNTEyM30.fX77S-tdZeGB0Uw8DkZHzotqJtU-1ltXbT9gs_MUzR8" \
            TELNYX_API_KEY="$TELNYX_API_KEY" TELNYX_PUBLIC_KEY="$TELNYX_PUBLIC_KEY" \
            DEEPGRAM_API_KEY="$DEEPGRAM_API_KEY" ELEVENLABS_API_KEY="$ELEVENLABS_API_KEY" ELEVENLABS_VOICE_ID="$ELEVENLABS_VOICE_ID" \
            TELEFONO_SECRETO="$TELEFONO_SECRETO" VOZ_URL_CLAVE="$VOZ_URL_CLAVE" >/dev/null
      - name: Subir
        if: steps.listo.outputs.ok == 'si'
        run: flyctl deploy --remote-only --app "$APP" --ha=false
      - name: ¿Contesta?
        if: steps.listo.outputs.ok == 'si'
        run: sleep 10 && curl -fsS "https://$APP.fly.dev/salud" || echo "Revisar los registros en fly.io"

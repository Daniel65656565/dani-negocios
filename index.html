<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DANI Negocios</title>
<!-- (c) 2026 Profeta Futuro. Todos los derechos reservados. -->
<meta name="description" content="Tus negocios en una sola app: citas, pedidos, envíos, mensajes y pagos.">
<meta name="theme-color" content="#0B5C7A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DANI Negocios">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="supabase-config.js"></script>
<style>
/* Layout: una columna para teléfono; cuadritos grandes de 2 en 2; cada negocio con su color; ayudante flotante */
:root{
  --bg:#F2F6F8; --surface:#FFFFFF; --ink:#10232F; --muted:#4A5F6C; --line:#D3DEE5;
  --sea:#0B5C7A; --sea-ink:#FFFFFF; --mango:#E8922A; --mango-soft:#FDF0DE;
  --ok:#2E7D4F; --ok-soft:#E3F3E8; --warn:#9A6212; --danger:#B23B3B; --danger-soft:#FBE9E9;
  --t1:#E2F0F6; --t2:#FDF0DE; --t3:#E7F1E4; --t4:#EEE8F6;
  --shadow:0 2px 0 rgba(16,35,47,.08);
  --f-display:"Lexend","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --base:19px; --biz:#0B5C7A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A21; --surface:#15252E; --ink:#EAF2F6; --muted:#A7BBC6; --line:#28404D;
  --sea:#4FB3D6; --sea-ink:#06202B; --mango:#F5B657; --mango-soft:#3A2C16;
  --ok:#6FCB93; --ok-soft:#173326; --warn:#E9B65E; --danger:#F08A8A; --danger-soft:#3A1D1D;
  --t1:#16303B; --t2:#33281A; --t3:#1C3021; --t4:#272237; --shadow:0 2px 0 rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A21; --surface:#15252E; --ink:#EAF2F6; --muted:#A7BBC6; --line:#28404D;
  --sea:#4FB3D6; --sea-ink:#06202B; --mango:#F5B657; --mango-soft:#3A2C16;
  --ok:#6FCB93; --ok-soft:#173326; --warn:#E9B65E; --danger:#F08A8A; --danger-soft:#3A1D1D;
  --t1:#16303B; --t2:#33281A; --t3:#1C3021; --t4:#272237; --shadow:0 2px 0 rgba(0,0,0,.3); color-scheme:dark}
html.xl{--base:22px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--base);line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.4em} h2{font-size:1.22em} h3{font-size:1.04em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
.demo-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:10px;font-size:.7em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.top{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--biz);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.3em;flex:none}
.top .sub{color:var(--muted);font-size:.8em}
.top .grow{flex:1;min-width:0}
.oferta{background:var(--mango-soft);border:2px solid var(--mango);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin-bottom:16px}
.oferta strong{display:block}
.oferta svg{width:34px;height:34px;flex:none;color:var(--mango)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:16px 12px 14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:150px}
.tile .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--biz) 14%,var(--surface));color:var(--biz)}
.tile .ico svg{width:32px;height:32px}
.tile .name{font-family:var(--f-display);font-weight:700;font-size:1.02em;line-height:1.2;padding-right:44px}
.tile:active{transform:translateY(1px)}
.say{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--biz)}
.say svg{width:22px;height:22px}
.big-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:18px;border:0;background:var(--biz);color:#fff;font-family:var(--f-display);font-weight:700;font-size:1.05em;cursor:pointer;padding:10px 16px;text-align:center;text-decoration:none}
.big-btn svg{width:26px;height:26px;flex:none}
.big-btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.big-btn.warm{background:var(--mango);color:#1F1405}
.big-btn.ok{background:var(--ok);color:#fff}
.big-btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.back{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;margin-bottom:14px}
.back svg{width:22px;height:22px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.muted{color:var(--muted)} .small{font-size:.82em}
label.lbl,span.lbl{display:block;font-weight:700;margin-bottom:6px}
input.in,select.in,textarea.in{width:100%;min-height:58px;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px}
textarea.in{min-height:110px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--biz);outline:none}
.progress{display:flex;gap:5px;margin:4px 0 16px}
.progress i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress i.on{background:var(--biz)}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;cursor:pointer;min-height:72px}
.choice[aria-pressed="true"]{border-color:var(--biz);background:color-mix(in srgb,var(--biz) 10%,var(--surface))}
.choice .dot{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);flex:none}
.choice[aria-pressed="true"] .dot{border-color:var(--biz);background:var(--biz);box-shadow:inset 0 0 0 4px var(--surface)}
.choice .grow{flex:1;min-width:0}
.price{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:72px;height:72px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-size:2em;font-weight:700;cursor:pointer}
.stepper .val{flex:1;text-align:center;font-family:var(--f-display);font-size:2em;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:700}
.chip[aria-pressed="true"]{background:var(--biz);border-color:var(--biz);color:#fff}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.sum dt{color:var(--muted)} .sum dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);padding-top:12px;margin-top:12px}
.total .price{font-size:1.6em;color:var(--biz)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 22px 44px}
.timeline li::before{content:"";position:absolute;left:13px;top:30px;bottom:0;width:4px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .b{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:3px solid var(--line);background:var(--surface)}
.timeline li.done .b{background:var(--ok);border-color:var(--ok)}
.timeline li.done::before{background:var(--ok)}
.timeline li.now .b{background:var(--mango);border-color:var(--mango);box-shadow:0 0 0 6px var(--mango-soft)}
.timeline li:not(.done):not(.now){color:var(--muted)}
.prod{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.prod .pic{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.4em;background:color-mix(in srgb,var(--biz) 14%,var(--surface));color:var(--biz)}
.prod.off{opacity:.55}
.qty{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty button{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.4em;font-weight:700;cursor:pointer}
.qty span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.75em;font-weight:700;background:var(--t1);color:var(--sea);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.new{background:var(--mango-soft);color:var(--warn)} .pill.bad{background:var(--danger-soft);color:var(--danger)}
.note{border-left:5px solid var(--mango);background:var(--mango-soft);border-radius:10px;padding:10px 12px}
.alarm{border:3px solid var(--danger);background:var(--danger-soft)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:.8em;color:var(--muted)}
.copy{display:flex;gap:8px;align-items:center}
.copy code{flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px;font-family:var(--f-display);font-size:1.15em;font-weight:700;overflow-wrap:anywhere}
.copy button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font-weight:700;cursor:pointer}
.bizlist{display:grid;gap:12px}
.biz{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.biz .grow{flex:1;min-width:0}
.biz .tipo{font-size:.78em;color:var(--muted)}
.badge{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--danger);color:#fff;font-weight:700;font-size:.8em}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{min-height:56px;border-radius:14px;border:2px solid var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:1.05em;cursor:pointer;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--ok);color:#fff}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.day{flex:none;width:76px;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 4px;text-align:center;cursor:pointer}
.day b{display:block;font-family:var(--f-display);font-size:1.4em}
.day small{display:block;font-size:.7em;color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--biz);background:var(--biz);color:#fff}
.day[aria-pressed="true"] small{color:#fff}
.day.full{opacity:.5}
.msg{display:grid;gap:6px}
.msg.unread{border-color:var(--biz)}
.msg header{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qrbox{display:grid;place-items:center;gap:8px;padding:12px;background:#fff;border-radius:14px;color:#10232F}
.qrbox canvas,.qrbox img{display:block;max-width:100%}
.owner-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.owner-tabs button{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:.85em}
.owner-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ofield{display:grid;gap:6px;min-width:0}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.owner input.in,.owner select.in,.owner textarea.in{min-height:48px;padding:8px 12px;font-size:.9em}
.owner .card{padding:14px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700}
.switch input{width:26px;height:26px;accent-color:var(--biz)}
.del{border:2px solid var(--danger);color:var(--danger);background:var(--danger-soft);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.sbtn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.sbtn.pri{background:var(--biz);border-color:var(--biz);color:#fff}
.addbtn{border:2px dashed var(--biz);color:var(--biz);background:none;border-radius:14px;padding:12px;font-weight:700;cursor:pointer;width:100%}
.order{display:grid;gap:8px}
.order header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.3em;font-variant-numeric:tabular-nums}
.kpi span{font-size:.75em;color:var(--muted)}
/* ayudante */
#robot{position:fixed;z-index:30;width:86px;height:86px;border-radius:50%;background:var(--sea);border:4px solid var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#robot.dani{background:#5B3E8F}
#robot svg{width:62px;height:62px}
#robot.talk .mouth{animation:talk .25s infinite alternate}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
#bubble{pointer-events:none;position:fixed;z-index:29;max-width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:3px solid var(--sea);border-radius:20px;padding:14px 16px;font-size:.95em;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#bubble.ask{pointer-events:auto}
#bubble .x{pointer-events:auto;float:right;margin:-4px -4px 4px 8px;border:0;background:var(--bg);border-radius:50%;width:36px;height:36px;font-size:1.2em;cursor:pointer}
#bubble .who{font-weight:700;font-size:.8em;color:var(--muted);display:block;margin-bottom:2px}
#bubble form{display:flex;gap:6px;margin-top:10px}
#bubble form input{flex:1;min-width:0;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg)}
#bubble form button{border:0;border-radius:12px;background:var(--sea);color:var(--sea-ink);font-weight:700;padding:0 12px}
#bubble .sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#bubble .sugs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 10px;font-size:.8em;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){#robot.talk .mouth{animation:none}}
@media (max-width:360px){.tiles{gap:10px}.tile{padding:14px 10px}.slots{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:1fr 1fr}}


/* ---- crecer: estilos de cada negocio ---- */
:root[data-borde="sin"] #app .tile,:root[data-borde="sin"] #app .card{border-color:transparent}
:root[data-borde="fino"] #app .tile,:root[data-borde="fino"] #app .card{border-width:1px}
:root[data-borde="grueso"] #app .tile,:root[data-borde="grueso"] #app .card{border-width:4px}
:root[data-bcolor="1"] #app .tile,:root[data-bcolor="1"] #app .card{border-color:color-mix(in srgb,var(--biz) 60%,var(--line))}
:root[data-esquinas="rectas"] #app .tile,:root[data-esquinas="rectas"] #app .card,:root[data-esquinas="rectas"] #app .big-btn{border-radius:6px}
:root[data-esquinas="muy"] #app .tile,:root[data-esquinas="muy"] #app .card,:root[data-esquinas="muy"] #app .big-btn{border-radius:30px}
:root[data-sombra="1"] #app .tile,:root[data-sombra="1"] #app .card{box-shadow:0 8px 22px color-mix(in srgb,var(--biz) 25%,transparent)}
:root[data-cuadros="color"] #app .tile,:root[data-cuadros="arcoiris"] #app .tile{background:color-mix(in srgb,var(--biz) 13%,var(--surface));border-color:color-mix(in srgb,var(--biz) 40%,var(--line))}
:root[data-cuadros="arcoiris"] #app .tile .ico{background:var(--biz);color:#fff}
#robot[data-tam="chico"]{width:62px;height:62px;border-width:3px}#robot[data-tam="chico"] svg{width:44px;height:44px}
#robot[data-tam="grande"]{width:118px;height:118px;border-width:5px}#robot[data-tam="grande"] svg{width:88px;height:88px}
#robot[data-tam="oculto"]{display:none}
#ov{position:fixed;inset:0;z-index:60;background:rgba(5,15,22,.55);display:grid;place-items:end center;padding:16px}
#ov .ovbox{width:100%;max-width:460px;position:relative;padding-top:44px;margin-bottom:max(12px,env(safe-area-inset-bottom))}
#ov .x{position:absolute;top:8px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);font-size:1.4em;cursor:pointer}
.kiosco .wrap{max-width:900px}
.kiosco #app{font-size:1.12em}
/* pantalla de la fila */
.modotv body,.modotv{background:#0B1820}
.tv{position:fixed;inset:0;background:linear-gradient(135deg,var(--biz),#0B1820 70%);color:#fff;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:auto 1fr;gap:2vw;padding:3vw;font-family:var(--f-display)}
.tvtop{grid-column:1/3;display:flex;align-items:center;gap:1.5vw;font-size:3vw}.tvtop .logo{width:5vw;height:5vw;font-size:2.6vw;background:#fff;color:var(--biz)}
.tvmain{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.tvlbl{font-size:3vw;opacity:.85}.tvnum{font-size:22vw;line-height:1;font-weight:700}.tvesp{font-size:2.4vw;opacity:.85}
.tvside{display:flex;flex-direction:column;justify-content:center;gap:2vw}
.tvof{background:rgba(255,255,255,.14);border-radius:2vw;padding:2vw;font-size:2vw}
.tvqr{background:#fff;color:#10232F;border-radius:2vw;padding:1.5vw;display:flex;flex-direction:column;align-items:center;gap:1vw;font-size:1.5vw;text-align:center}
@media (max-width:700px){.tv{grid-template-columns:1fr}.tvtop{grid-column:1}.tvnum{font-size:40vw}}
/* impresos: tarjetas, volantes, carteles, stickers */
.impresos{display:flex;flex-direction:column;gap:16px;align-items:center;overflow-x:auto}
.hoja{width:8.5in;min-height:11in;background:#fff;color:#10232F;padding:.5in .5in;box-shadow:0 2px 12px rgba(0,0,0,.2);box-sizing:border-box}
.hoja.tjs{display:grid;grid-template-columns:3.5in 3.5in;grid-auto-rows:2in;gap:0;justify-content:center;padding:.5in .75in}
.imp{box-sizing:border-box;border:1px dashed #bbb;overflow:hidden}
.imp .logo{width:.55in;height:.55in;border-radius:.12in;color:#fff;display:grid;place-items:center;font-weight:700;font-size:16pt;flex:none}
.imp.tj{padding:.18in;border-left:6px solid var(--biz)}.imp.tj.at{display:flex;align-items:center;gap:.15in}
